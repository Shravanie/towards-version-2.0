{% extends "base.html" %}

{% block title %}Login - Towards Version 2.0{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="brand-mark">V2</div>

            <h1>Welcome back</h1>

            <p>
                Continue your journey towards a better version of yourself.
            </p>

        </div>


        <form method="POST" class="auth-form">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="primary-button">
                Log In
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create one
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
