{% extends "base.html" %}

{% block title %}Add Activity - Towards Version 2.0{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-page-header">
        <a href="{{ url_for('student.dashboard') }}" class="back-link">
            ← Back to Dashboard
        </a>

        <h1>Add a New Activity</h1>

        <p>
            Create an activity that you want to track and improve.
        </p>
    </div>


    <div class="form-card">

        <form method="POST" class="activity-form">

            <div class="form-group">
                <label for="title">Activity Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. Read a book"
                    required
                >
            </div>


            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe what you want to accomplish..."
                    rows="4"
                ></textarea>
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" name="category" required>
                        <option value="" disabled selected>
                            Select category
                        </option>

                        <option value="Academic">Academic</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Personal">Personal</option>
                        <option value="Skill">Skill Development</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="priority">Priority</label>

                    <select id="priority" name="priority" required>
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="frequency">Frequency</label>

                    <select id="frequency" name="frequency" required>
                        <option value="" disabled selected>
                            Select frequency
                        </option>

                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="target">Target</label>

                    <input
                        type="number"
                        id="target"
                        name="target"
                        min="0"
                        step="0.01"
                        placeholder="e.g. 30"
                    >
                </div>


                <div class="form-group">
                    <label for="unit">Unit</label>

                    <input
                        type="text"
                        id="unit"
                        name="unit"
                        placeholder="e.g. minutes"
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="start_date">Start Date</label>

                    <input
                        type="date"
                        id="start_date"
                        name="start_date"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="end_date">End Date / Deadline</label>

                    <input
                        type="date"
                        id="end_date"
                        name="end_date"
                    >
                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('student.dashboard') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Activity
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
